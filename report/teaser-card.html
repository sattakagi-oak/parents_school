<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<!-- LINEのトーク画面でそのまま読める、個別診断レポートの見本（1040×1300） -->
<style>
:root{--navy:#0b254a;--navy2:#153b6f;--gold:#b48a25;--gold2:#dfbd67;--ink:#17243a;--sub:#56657a;--line:#e3e8ef;--ivory:#faf8f3}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1040px;height:1300px;overflow:hidden}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;color:var(--ink);background:#fff;position:relative}
.mincho{font-family:"Hiragino Mincho ProN",serif;font-weight:700}
.head{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:34px 50px 30px;position:relative}
.head .k{font-size:24px;letter-spacing:.18em;color:var(--gold2);font-weight:800}
.head h1{font-size:54px;line-height:1.3;margin-top:6px}
.head .meta{margin-top:12px;font-size:28px;color:#d6e1ef}
.head .meta b{color:#fff}
.tag{position:absolute;right:40px;top:34px;background:#fff4d6;color:#7a5a00;font-size:24px;font-weight:900;padding:6px 16px;border-radius:999px}
.body{padding:30px 50px 0}
.lbl{display:inline-block;font-size:24px;font-weight:900;color:var(--gold);border:2px solid var(--gold2);border-radius:999px;padding:2px 16px}
.worry{margin-top:12px;background:var(--ivory);border-left:8px solid var(--gold2);border-radius:12px;padding:18px 24px;font-size:34px;font-weight:800;line-height:1.5}
.res{display:grid;grid-template-columns:280px 1fr;gap:26px;align-items:center;margin-top:24px}
.res .t{font-size:28px;color:var(--sub)}
.res .t b{display:block;font-size:56px;color:var(--navy);font-family:"Hiragino Mincho ProN",serif}
.res .str{margin-top:10px;font-size:30px;font-weight:800;line-height:1.5}
.res .str em{font-style:normal;color:var(--gold)}
.lock{margin-top:24px;border:3px dashed #cfd6e0;border-radius:20px;padding:18px 26px;position:relative}
.lock .h{font-size:34px;font-weight:900;color:var(--navy)}
.lock .h::before{content:"🔒 "}
.lock .blur{margin-top:8px;font-size:30px;line-height:1.6;color:#6b7686;filter:blur(7px);user-select:none}
.cta{position:absolute;left:0;right:0;bottom:0;height:270px;background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;text-align:center;padding-top:30px}
.cta .s{font-size:30px;color:var(--gold2);font-weight:900}
.cta .m{font-size:44px;margin-top:6px}
.cta .send{display:inline-block;margin-top:16px;background:#06c755;font-size:38px;font-weight:900;padding:12px 34px;border-radius:999px}
.cta .send b{background:#fff;color:#06c755;padding:0 10px;border-radius:8px;margin:0 4px}
</style></head><body>
<div class="head"><div class="k">個別診断レポート（見本）</div><h1 class="mincho">わが子の強み・伸ばし方</h1>
<div class="meta">お子さん <b>ゆうくん（小3）</b>　担当 <b>みほ先生</b></div></div>
<div class="tag">サンプル</div>
<div class="body">
 <span class="lbl">今回のお悩み</span>
 <div class="worry">「宿題を始めるまでに1時間。声をかけると怒って、余計に始めない」</div>
 <div class="res">
  <svg viewBox="-30 0 225 150" width="280" height="187"><g fill="none" stroke="#e3e8ef" stroke-width="1.5"><polygon points="75,15 135,75 75,135 15,75"/><polygon points="75,39 111,75 75,111 39,75"/><line x1="75" y1="15" x2="75" y2="135"/><line x1="15" y1="75" x2="135" y2="75"/></g><polygon points="75,15 111,75 75,99 51,75" fill="rgba(223,189,103,.4)" stroke="#b48a25" stroke-width="2.5"/><g font-size="13" font-weight="800" fill="#56657a" text-anchor="middle"><text x="75" y="11">自由</text><text x="138" y="80" text-anchor="start">こだわり</text><text x="75" y="149">共感</text><text x="12" y="80" text-anchor="end">目標</text></g></svg>
  <div><div class="t">お子さんのタイプ<b>自由型</b></div>
   <div class="str"><em>強み</em> 好きなことへの集中力<br><em>強み</em> 納得したらやり抜く力</div></div>
 </div>
 <div class="lock"><div class="h">今日からできる3つのこと</div>
  <div class="blur">1. 始める時間をゆうくんに決めてもらう<br>2. 答えより先に「どこまでわかった？」<br>3. 明日の準備は「準備表」に任せる</div></div>
</div>
<div class="cta"><div class="s">この続きは、個別診断を受けた方だけに</div>
<div class="m mincho">わが子専用の「3つのこと」が届きます</div>
<div class="send">このLINEに<b>個別診断</b>と送るだけ</div></div>
</body></html>
